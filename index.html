        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        /* STYLES TIMER MUNDUR */
        .timer-container {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeeba;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .timer-time {
            font-size: 1.4em;
            font-family: monospace;
            background: #856404;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            letter-spacing: 2px;
        }

        .timer-container.warning {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
            animation: pulse 1s infinite alternate;
        }

        .timer-container.warning .timer-time {
            background: #721c24;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.75; }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background-color: white;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .guide-box {
            background: #eef2ff;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .guide-box h3 {
            color: #3730a3;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .guide-box ol {
            margin-left: 20px;
            line-height: 1.6;
            color: #334155;
        }

        .guide-box li {
            margin-bottom: 6px;
        }
