<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISC Assessment | Albea Indonesia</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #172554;
      --panel-bg: #ffffff;
      --bg: linear-gradient(135deg, #eef2ff, #f8fafc);
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #b91c1c;
      --success: #166534;
      --border: #e5e7eb;
      --info: #dbeafe;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 40px auto;
      background: var(--panel-bg);
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .header {
      padding: 32px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 2.2rem;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .content {
      padding: 32px 24px 40px;
    }

    .panel {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .alert.error {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .alert.success {
      background: #dcfce7;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .alert.info {
      background: var(--info);
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 18px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: 2px solid rgba(30, 58, 138, 0.15);
      border-color: var(--primary);
    }

    button {
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
      width: 100%;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: var(--text);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .question-block {
      display: none;
    }

    .question-block.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-number {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      font-size: 0.8rem;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .option label {
      display: block;
      width: 100%;
      cursor: pointer;
      margin: 0;
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      transition: width 0.2s ease;
    }

    .nav-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .nav-row button {
      width: auto;
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    .done-box {
      text-align: center;
      padding: 30px 20px;
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
    }

    .done-box h2 {
      color: #166534;
      margin-top: 0;
    }

    @media (max-width: 720px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .nav-row {
        flex-direction: column;
      }

      .container {
        margin: 20px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DISC Assessment</h1>
      <p>Albea Indonesia</p>
    </div>

    <div class="content">
      <div id="formScreen">
        <div class="panel">
          <div id="formMessage" class="alert info">Please complete your personal information before starting the DISC assessment.</div>

          <div class="form-grid">
            <div class="field">
              <label for="fullName">Nama Lengkap</label>
              <input id="fullName" type="text" placeholder="Masukkan nama lengkap" />
            </div>

            <div class="field">
              <label for="gender">Jenis Kelamin</label>
              <select id="gender">
                <option value="">Pilih jenis kelamin</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>

            <div class="field">
              <label for="email">Alamat Email</label>
              <input id="email" type="email" placeholder="contoh@email.com" />
            </div>

            <div class="field">
              <label for="phone">Nomor WA / Telepon</label>
              <input id="phone" type="text" placeholder="08xxxxxxxxxx" />
            </div>

            <div class="field">
              <label for="position">Posisi yang Akan Dilamar</label>
              <input id="position" type="text" placeholder="Contoh: Front End Developer" />
            </div>

            <div class="field">
              <label for="education">Pendidikan (Jurusan)</label>
              <input id="education" type="text" placeholder="Contoh: Teknik Informatika" />
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="campus">Kampus</label>
              <input id="campus" type="text" placeholder="Nama kampus / universitas" />
            </div>
          </div>

          <div style="margin-top: 16px;">
            <button id="startAssessmentBtn" class="primary-btn">Lanjut ke Assessment</button>
          </div>
        </div>
      </div>

      <div id="assessmentScreen" class="hidden">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div id="questionContainer"></div>

        <div class="nav-row">
          <button id="prevBtn" class="secondary-btn">Sebelumnya</button>
          <button id="nextBtn" class="primary-btn">Berikutnya</button>
          <button id="submitBtn" class="primary-btn hidden">Submit</button>
        </div>
      </div>

      <div id="doneScreen" class="hidden">
        <div class="panel done-box">
          <h2>Assessment Berhasil Dikirim</h2>
          <p>Terima kasih. Data Anda telah berhasil dikirim ke tim HR Albea Indonesia.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      { id: 1, most: 'Ambitious', least: 'Friendly' },
      { id: 2, most: 'Enthusiastic', least: 'Competitive' },
      { id: 3, most: 'Loyal', least: 'Outgoing' },
      { id: 4, most: 'Analytical', least: 'Spontaneous' },
      { id: 5, most: 'Decisive', least: 'Reliable' },
      { id: 6, most: 'Expressive', least: 'Logical' },
      { id: 7, most: 'Patient', least: 'Aggressive' },
      { id: 8, most: 'Accurate', least: 'Adventurous' },
      { id: 9, most: 'Direct', least: 'Sympathetic' },
      { id: 10, most: 'Persuasive', least: 'Practical' },
      { id: 11, most: 'Supportive', least: 'Bold' },
      { id: 12, most: 'Cautious', least: 'Talkative' },
      { id: 13, most: 'Forceful', least: 'Cheerful' },
      { id: 14, most: 'Optimistic', least: 'Organized' },
      { id: 15, most: 'Cooperative', least: 'Commanding' },
      { id: 16, most: 'Precise', least: 'Playful' },
      { id: 17, most: 'Confident', least: 'Gentle' },
      { id: 18, most: 'Charming', least: 'Meticulous' },
      { id: 19, most: 'Dependable', least: 'Adventurous' },
      { id: 20, most: 'Detailed', least: 'Impulsive' },
      { id: 21, most: 'Powerful', least: 'Cheerful' },
      { id: 22, most: 'Talkative', least: 'Cautious' },
      { id: 23, most: 'Peacemaker', least: 'Risk-taker' },
      { id: 24, most: 'Perfectionist', least: 'Outspoken' }
    ];

    const traitMap = {
      Ambitious: 'D', Friendly: 'I', Enthusiastic: 'I', Competitive: 'D', Loyal: 'S', Outgoing: 'I',
      Analytical: 'C', Spontaneous: 'I', Decisive: 'D', Reliable: 'S', Expressive: 'I', Logical: 'C',
      Patient: 'S', Aggressive: 'D', Accurate: 'C', Adventurous: 'I', Direct: 'D', Sympathetic: 'S',
      Persuasive: 'I', Practical: 'C', Supportive: 'S', Bold: 'D', Cautious: 'C', Talkative: 'I',
      Forceful: 'D', Cheerful: 'I', Optimistic: 'I', Organized: 'C', Cooperative: 'S', Commanding: 'D',
      Precise: 'C', Playful: 'I', Confident: 'D', Gentle: 'S', Charming: 'I', Meticulous: 'C',
      Dependable: 'S', Detailed: 'C', Impulsive: 'I', Powerful: 'D', Peacemaker: 'S', 'Risk-taker': 'D',
      Perfectionist: 'C', Outspoken: 'D'
    };

    let currentIndex = 0;
    let answers = {};
    let formData = {};

    function setFormMessage(type, text) {
      const el = document.getElementById('formMessage');
      el.className = `alert ${type}`;
      el.textContent = text;
    }

    function validateForm() {
      const fullName = document.getElementById('fullName').value.trim();
      const gender = document.getElementById('gender').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const position = document.getElementById('position').value.trim();
      const education = document.getElementById('education').value.trim();
      const campus = document.getElementById('campus').value.trim();

      if (!fullName || !gender || !email || !phone || !position || !education || !campus) {
        setFormMessage('error', 'Semua data diri wajib diisi sebelum memulai assessment.');
        return false;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        setFormMessage('error', 'Alamat email tidak valid.');
        return false;
      }

      if (phone.length < 8) {
        setFormMessage('error', 'Nomor WA / telepon minimal 8 digit.');
        return false;
      }

      formData = { fullName, gender, email, phone, position, education, campus };
      setFormMessage('success', 'Data diri berhasil diterima. Anda dapat melanjutkan ke assessment.');
      return true;
    }

    function startAssessment() {
      if (!validateForm()) return;

      document.getElementById('formScreen').classList.add('hidden');
      document.getElementById('assessmentScreen').classList.remove('hidden');
      currentIndex = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const percentage = ((currentIndex + 1) / questions.length) * 100;
      document.getElementById('progressFill').style.width = `${percentage}%`;

      document.getElementById('questionContainer').innerHTML = `
        <div class="panel question-block active">
          <div class="question-number">Pertanyaan ${currentIndex + 1} dari ${questions.length}</div>
          <div class="question-text">Pilih jawaban yang paling sesuai dengan diri Anda.</div>

          <div class="options">
            <div class="option">
              <input type="radio" id="most-${q.id}" name="q-${q.id}" value="most" ${answers[q.id] === 'most' ? 'checked' : ''} />
              <label for="most-${q.id}"><strong>Most like me:</strong> ${q.most}</label>
            </div>

            <div class="option">
              <input type="radio" id="least-${q.id}" name="q-${q.id}" value="least" ${answers[q.id] === 'least' ? 'checked' : ''} />
              <label for="least-${q.id}"><strong>Least like me:</strong> ${q.least}</label>
            </div>
          </div>
        </div>
      `;

      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener('change', (event) => {
          const qid = Number(event.target.name.replace('q-', ''));
          answers[qid] = event.target.value;
        });
      });

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const submitBtn = document.getElementById('submitBtn');

      prevBtn.style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
      nextBtn.classList.toggle('hidden', currentIndex === questions.length - 1);
      submitBtn.classList.toggle('hidden', currentIndex !== questions.length - 1);
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      }
    }

    function calculateScores() {
      const score = { D: 0, I: 0, S: 0, C: 0 };

      questions.forEach((q) => {
        const selected = answers[q.id];
        if (!selected) return;

        const trait = selected === 'most' ? q.most : q.least;
        const type = traitMap[trait];
        if (type) score[type] += 1;
      });

      return score;
    }

    function getProfileType(scores) {
      const highest = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
      return highest ? highest[0] : 'D';
    }

    async function submitAssessment() {
      const scores = calculateScores();
      const profileType = getProfileType(scores);

      const payload = {
        fullName: formData.fullName,
        gender: formData.gender,
        email: formData.email,
        phone: formData.phone,
        position: formData.position,
        education: formData.education,
        campus: formData.campus,
        scores,
        profileType,
        answers
      };

      try {
        const response = await fetch('/api/submit-assessment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
          setFormMessage('error', data.message || 'Gagal mengirim assessment.');
          return;
        }

        document.getElementById('assessmentScreen').classList.add('hidden');
        document.getElementById('doneScreen').classList.remove('hidden');
      } catch (error) {
        setFormMessage('error', 'Terjadi kesalahan saat mengirim assessment. Silakan coba lagi.');
      }
    }

    document.getElementById('startAssessmentBtn').addEventListener('click', startAssessment);
    document.getElementById('prevBtn').addEventListener('click', prevQuestion);
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('submitBtn').addEventListener('click', submitAssessment);
  </script>
</body>
</html>
